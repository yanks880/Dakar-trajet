name: Dakar Bus CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate this workflow by branch/ref so a future workflow cannot cancel it accidentally.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify backend syntax
        run: python -m compileall -q backend/app
      - name: Verify backend imports
        run: python -c "from backend.app.main import app; assert app.title == 'Dakar Bus API'"
      - name: Verify GTFS validator
        run: python -c "from backend.app.main import validate_gtfs; assert isinstance(validate_gtfs({}), list)"
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v
      - name: Build Flutter web
        run: flutter build web --release --base-href /Dakar-trajet/

  deploy:
    name: Build and deploy
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
      - uses: actions/configure-pages@v5
      - run: flutter pub get
      - run: flutter build web --release --base-href /Dakar-trajet/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
